<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" width="1600" height="720" font-family="Inter, -apple-system, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="tip" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#6E6E6E"/>
    </marker>
    <marker id="tipKey" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3ECF8E"/>
    </marker>
  </defs>

  <rect width="1600" height="720" fill="#1C1C1C"/>

  <text x="70" y="60" font-size="40" font-weight="700" fill="#EDEDED">Four handoffs</text>
  <text x="70" y="94" font-size="21" fill="#8F8F8F">None of them is a connector you install.</text>

  <!-- SUPABASE lane -->
  <rect x="70" y="126" width="1460" height="104" rx="10" fill="#3ECF8E" opacity="0.14"/>
  <rect x="70" y="126" width="5" height="104" rx="2.5" fill="#3ECF8E"/>
  <text x="100" y="164" font-size="20" font-weight="700" fill="#3ECF8E" letter-spacing="2.6">SUPABASE</text>
  <text x="100" y="196" font-size="18" fill="#B4B4B4">Postgres / Auth / Storage / Realtime</text>
  <text x="1500" y="196" font-size="16" fill="#7A7A7A" text-anchor="end">the product runs here</text>

  <!-- EVE lane -->
  <rect x="70" y="500" width="1460" height="104" rx="10" fill="#FFFFFF" opacity="0.06"/>
  <rect x="70" y="500" width="5" height="104" rx="2.5" fill="#EDEDED"/>
  <text x="100" y="538" font-size="20" font-weight="700" fill="#EDEDED" letter-spacing="2.6">EVE</text>
  <text x="100" y="570" font-size="18" fill="#B4B4B4">tools / skills / hooks / approvals</text>
  <text x="1500" y="570" font-size="16" fill="#7A7A7A" text-anchor="end">the agent runs here</text>

  <!-- 1 : down -->
  <line x1="290" y1="230" x2="290" y2="300" stroke="#6E6E6E" stroke-width="2.5"/>
  <line x1="290" y1="460" x2="290" y2="492" stroke="#6E6E6E" stroke-width="2.5" marker-end="url(#tip)"/>
  <circle cx="290" cy="266" r="20" fill="#1C1C1C" stroke="#6E6E6E" stroke-width="2.5"/>
  <text x="290" y="273" font-size="18" font-weight="700" fill="#C9C9C9" text-anchor="middle">1</text>
  <text x="290" y="352" font-size="21" font-weight="600" fill="#EDEDED" text-anchor="middle">A row changes.</text>
  <text x="290" y="382" font-size="19" fill="#B4B4B4" text-anchor="middle">A Database Webhook</text>
  <text x="290" y="408" font-size="19" fill="#B4B4B4" text-anchor="middle">starts a session.</text>
  <text x="290" y="440" font-size="17" fill="#7A7A7A" text-anchor="middle">Nothing polls.</text>

  <!-- 2 : up, highlighted -->
  <line x1="700" y1="492" x2="700" y2="462" stroke="#3ECF8E" stroke-width="4.5"/>
  <line x1="700" y1="300" x2="700" y2="234" stroke="#3ECF8E" stroke-width="4.5" marker-end="url(#tipKey)"/>
  <circle cx="700" cy="266" r="24" fill="#3ECF8E"/>
  <text x="700" y="274" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="700" y="354" font-size="23" font-weight="700" fill="#3ECF8E" text-anchor="middle">The agent signs in.</text>
  <text x="700" y="386" font-size="19" fill="#EDEDED" text-anchor="middle">An ordinary user.</text>
  <text x="700" y="412" font-size="19" font-weight="600" fill="#EDEDED" text-anchor="middle">Row Level Security applies.</text>
  <text x="700" y="444" font-size="17" fill="#7A7A7A" text-anchor="middle">Not a service key.</text>

  <!-- 3 : up -->
  <line x1="1090" y1="492" x2="1090" y2="460" stroke="#6E6E6E" stroke-width="2.5"/>
  <line x1="1090" y1="300" x2="1090" y2="234" stroke="#6E6E6E" stroke-width="2.5" marker-end="url(#tip)"/>
  <circle cx="1090" cy="266" r="20" fill="#1C1C1C" stroke="#6E6E6E" stroke-width="2.5"/>
  <text x="1090" y="273" font-size="18" font-weight="700" fill="#C9C9C9" text-anchor="middle">3</text>
  <text x="1090" y="352" font-size="21" font-weight="600" fill="#EDEDED" text-anchor="middle">What it did,</text>
  <text x="1090" y="382" font-size="19" fill="#B4B4B4" text-anchor="middle">written to a table.</text>
  <text x="1090" y="414" font-size="17" fill="#7A7A7A" text-anchor="middle">Realtime fans it out.</text>

  <!-- 4 : down -->
  <line x1="1420" y1="230" x2="1420" y2="300" stroke="#6E6E6E" stroke-width="2.5"/>
  <line x1="1420" y1="460" x2="1420" y2="492" stroke="#6E6E6E" stroke-width="2.5" marker-end="url(#tip)"/>
  <circle cx="1420" cy="266" r="20" fill="#1C1C1C" stroke="#6E6E6E" stroke-width="2.5"/>
  <text x="1420" y="273" font-size="18" font-weight="700" fill="#C9C9C9" text-anchor="middle">4</text>
  <text x="1420" y="352" font-size="21" font-weight="600" fill="#EDEDED" text-anchor="middle">An Auth token</text>
  <text x="1420" y="382" font-size="19" fill="#B4B4B4" text-anchor="middle">decides who may</text>
  <text x="1420" y="408" font-size="19" fill="#B4B4B4" text-anchor="middle">answer the agent.</text>

  <!-- footer -->
  <line x1="70" y1="650" x2="1530" y2="650" stroke="#3A3A3A" stroke-width="1.5"/>
  <text x="70" y="690" font-size="22" font-weight="700" fill="#EDEDED">eve decides what the agent can do.<tspan fill="#3ECF8E" dx="10">Postgres decides what it is allowed to.</tspan></text>
</svg>
